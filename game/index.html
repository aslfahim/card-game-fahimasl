<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ember Pact — an elemental duel of cards</title>
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<main id="app">
  <header id="masthead">
    <div class="brand">
      <span class="brand-flame">🔥</span>
      <span class="brand-name">EMBER PACT</span>
      <span class="brand-sub">an elemental duel of cards</span>
    </div>
    <div class="brand-rules">
      <span class="rule-chip fire">▲ Fire feeds Fire</span>
      <span class="rule-chip water">● Water douses Fire</span>
      <span class="rule-chip earth">■ Earth endures</span>
      <span class="rule-chip storm">◆ Storm strikes</span>
    </div>
  </header>
  <section id="table" aria-label="Duel table"></section>
  <div id="overlay"></div>
  <footer id="footnote">
    Ember Pact — an original card game. No accounts, no network, no copied art.
    Play with mouse or keyboard: 1–9 pick a card, E ends your turn, N starts a new duel.
  </footer>
</main>
<script type="module" src="src/main.js"></script>
</body>
</html>
